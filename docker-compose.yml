services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qbr
      # Local development credentials only - not for production.
      # The port below is bound to 127.0.0.1, so the database is not reachable from other machines.
      # In a cloud deployment, use a managed database and supply the password from a secret store.
      POSTGRES_PASSWORD: qbr_local
      POSTGRES_DB: qbr
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qbr -d qbr"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
  redis_data:
